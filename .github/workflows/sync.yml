name: Lyfta szinkron

on:
  schedule:
    - cron: '0 20 * * *'   # minden nap 20:00 UTC (nyáron 22:00, télen 21:00 budapesti idő)
  workflow_dispatch:       # kézi indítás az Actions fülön
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: lyfta-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tesztek
        run: node scripts/test.mjs
      - name: Edzések lehúzása a Lyftából
        env:
          LYFTA_API_KEY: ${{ secrets.LYFTA_API_KEY }}
        run: node scripts/sync.mjs
      - name: Commit, ha változott
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/history.json
          if git diff --cached --quiet; then
            echo "Nincs új edzés."
          else
            git commit -m "Update workout history"
            git push
          fi
      - name: Oldal összeállítása
        run: |
          mkdir _site
          cp -r index.html favicon.svg robots.txt css js data _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: sync
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
